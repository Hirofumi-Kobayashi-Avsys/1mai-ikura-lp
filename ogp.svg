<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fbfaf6"/>
  <!-- アクセント帯 -->
  <rect x="0" y="0" width="1200" height="8" fill="#ffd84d"/>
  <!-- レシート風カード -->
  <rect x="100" y="80" width="440" height="470" rx="6" fill="#fff" stroke="#e3e1d8" stroke-width="2"/>
  <!-- ミシン目 -->
  <line x1="100" y1="490" x2="540" y2="490" stroke="#e3e1d8" stroke-width="2" stroke-dasharray="12,8"/>
  <!-- ロゴ -->
  <rect x="136" y="118" width="52" height="52" rx="12" fill="#ffd84d" transform="rotate(-6,162,144)"/>
  <text x="162" y="151" text-anchor="middle" font-family="monospace" font-size="28" font-weight="700" fill="#3a2e00">÷</text>
  <text x="210" y="152" font-family="sans-serif" font-size="26" font-weight="900" fill="#1d2433">1枚いくら</text>
