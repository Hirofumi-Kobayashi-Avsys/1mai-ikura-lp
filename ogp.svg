  <text x="680" y="200" font-family="sans-serif" font-size="52" font-weight="900" fill="#1d2433">おむつは</text>
  <text x="680" y="275" font-family="sans-serif" font-size="52" font-weight="900" fill="#1d2433">「1枚いくら」</text>
  <rect x="678" y="285" width="390" height="14" rx="4" fill="#ffd84d" opacity="0.6"/>
  <text x="680" y="340" font-family="sans-serif" font-size="52" font-weight="900" fill="#1d2433">で選ぶ。</text>
  <text x="680" y="420" font-family="sans-serif" font-size="22" fill="#5d6576">安い日にLINEでお知らせ。</text>
  <text x="680" y="455" font-family="sans-serif" font-size="22" fill="#5d6576">登録は無料。</text>
  <!-- URL -->
  <text x="600" y="590" text-anchor="middle" font-family="monospace" font-size="18" fill="#5d6576">1mai-ikura.vercel.app</text>
