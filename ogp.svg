  <text x="504" y="224" text-anchor="end" font-family="monospace" font-size="18" font-weight="600" fill="#1d2433">24.3円/枚</text>
  <line x1="136" y1="236" x2="504" y2="236" stroke="#e3e1d8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="136" y="272" font-family="sans-serif" font-size="16" fill="#5d6576">パンパース パンツ L</text>
  <text x="504" y="272" text-anchor="end" font-family="monospace" font-size="18" font-weight="600" fill="#1d2433">39.9円/枚</text>
  <line x1="136" y1="284" x2="504" y2="284" stroke="#e3e1d8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="136" y="320" font-family="sans-serif" font-size="16" fill="#5d6576">メリーズ パンツ L</text>
  <text x="504" y="320" text-anchor="end" font-family="monospace" font-size="18" font-weight="600" fill="#1f8a5b">35.4円/枚</text>
  <line x1="136" y1="332" x2="504" y2="332" stroke="#e3e1d8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="136" y="368" font-family="sans-serif" font-size="16" fill="#5d6576">ムーニー テープ L</text>
  <text x="504" y="368" text-anchor="end" font-family="monospace" font-size="18" font-weight="600" fill="#1d2433">41.2円/枚</text>
  <line x1="136" y1="380" x2="504" y2="380" stroke="#e3e1d8" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- スタンプ -->
  <rect x="300" y="400" width="160" height="48" rx="8" fill="none" stroke="#1f8a5b" stroke-width="3" transform="rotate(-6,380,424)"/>
  <text x="380" y="431" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#1f8a5b" transform="rotate(-6,380,424)">いちばん安い</text>
