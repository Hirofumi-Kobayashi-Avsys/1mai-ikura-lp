<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fbfaf6"/>
  <!-- アクセント帯 -->
  <rect x="0" y="0" width="1200" height="8" fill="#ffd84d"/>
  <!-- レシート風カード -->
  <rect x="100" y="80" width="440" height="470" rx="6" fill="#fff" stroke="#e3e1d8" stroke-width="2"/>
  <!-- ミシン目 -->
  <line x1="100" y1="446" x2="540" y2="446" stroke="#e3e1d8" stroke-width="2" stroke-dasharray="12,8"/>
  <!-- ロゴ -->
  <rect x="136" y="118" width="52" height="52" rx="12" fill="#ffd84d" transform="rotate(-6,162,144)"/>
  <text x="162" y="151" text-anchor="middle" font-family="Consolas, BIZ UDGothic, monospace" font-size="28" font-weight="700" fill="#3a2e00">÷</text>
  <text x="210" y="152" font-family="BIZ UDPGothic, Yu Gothic, Meiryo, sans-serif" font-size="26" font-weight="900" fill="#1d2433">1枚いくら</text>
  <!-- 区切り -->
  <line x1="136" y1="186" x2="504" y2="186" stroke="#e3e1d8" stroke-width="1"/>
  <!-- 商品行（LP と同じ説明用の例） -->
  <text x="136" y="216" font-family="BIZ UDPGothic, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#5d6576">同じおむつ・同じサイズでも（数字は例）</text>
  <text x="136" y="262" font-family="BIZ UDPGothic, Yu Gothic, Meiryo, sans-serif" font-size="18" fill="#1d2433">62枚×3パック</text>
  <text x="136" y="286" font-family="Consolas, BIZ UDGothic, monospace" font-size="14" fill="#5d6576">6,763円 ÷ 186枚</text>
  <text x="504" y="274" text-anchor="end" font-family="Consolas, BIZ UDGothic, monospace" font-size="20" font-weight="600" fill="#1d2433">36.4円/枚</text>
  <line x1="136" y1="302" x2="504" y2="302" stroke="#e3e1d8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="136" y="330" font-family="BIZ UDPGothic, Yu Gothic, Meiryo, sans-serif" font-size="18" fill="#1d2433">58枚×4パック</text>
  <text x="136" y="354" font-family="Consolas, BIZ UDGothic, monospace" font-size="14" fill="#5d6576">7,980円 ÷ 232枚</text>
  <text x="504" y="342" text-anchor="end" font-family="Consolas, BIZ UDGothic, monospace" font-size="20" font-weight="600" fill="#1d2433">34.4円/枚</text>
  <line x1="136" y1="370" x2="504" y2="370" stroke="#e3e1d8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="136" y="398" font-family="BIZ UDPGothic, Yu Gothic, Meiryo, sans-serif" font-size="18" fill="#1d2433">54枚×3パック（セール）</text>
  <text x="136" y="422" font-family="Consolas, BIZ UDGothic, monospace" font-size="14" fill="#5d6576">5,280円 ÷ 162枚</text>
  <text x="504" y="410" text-anchor="end" font-family="Consolas, BIZ UDGothic, monospace" font-size="20" font-weight="600" fill="#1f8a5b">32.6円/枚</text>
  <line x1="136" y1="438" x2="504" y2="438" stroke="#e3e1d8" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- スタンプ -->
  <rect x="300" y="460" width="160" height="48" rx="8" fill="none" stroke="#1f8a5b" stroke-width="3" transform="rotate(-6,380,484)"/>
  <text x="380" y="491" text-anchor="middle" font-family="BIZ UDPGothic, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#1f8a5b" transform="rotate(-6,380,484)">いちばん安い</text>
  <!-- 右側コピー -->
  <text x="680" y="200" font-family="BIZ UDPGothic, Yu Gothic, Meiryo, sans-serif" font-size="52" font-weight="900" fill="#1d2433">おむつは</text>
  <text x="680" y="275" font-family="BIZ UDPGothic, Yu Gothic, Meiryo, sans-serif" font-size="52" font-weight="900" fill="#1d2433">「1枚いくら」</text>
  <rect x="678" y="285" width="390" height="14" rx="4" fill="#ffd84d" opacity="0.6"/>
  <text x="680" y="340" font-family="BIZ UDPGothic, Yu Gothic, Meiryo, sans-serif" font-size="52" font-weight="900" fill="#1d2433">で選ぶ。</text>
  <text x="680" y="420" font-family="BIZ UDPGothic, Yu Gothic, Meiryo, sans-serif" font-size="22" fill="#5d6576">安い日にLINEでお知らせ。</text>
  <text x="680" y="455" font-family="BIZ UDPGothic, Yu Gothic, Meiryo, sans-serif" font-size="22" fill="#5d6576">登録は無料。</text>
  <!-- URL -->
  <text x="600" y="590" text-anchor="middle" font-family="Consolas, BIZ UDGothic, monospace" font-size="18" fill="#5d6576">add-value-sys.github.io/1mai-ikura-lp</text>
</svg>
