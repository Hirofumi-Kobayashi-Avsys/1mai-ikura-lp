name: 毎日おむつ価格を取得

on:
  schedule:
    - cron: '0 22 * * *'   # 毎日 07:00 JST（UTC+9 → UTC 22:00）
  workflow_dispatch:         # 手動実行ボタン

jobs:
  crawl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawler

    steps:
      - uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 前回のDBを復元
        uses: actions/cache@v4
        with:
          path: crawler/prices.db
          key: prices-db-${{ github.run_id }}
          restore-keys: |
            prices-db-

      - name: 価格を取得してDBに保存
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          PYTHONUTF8: '1'
        run: python main.py
