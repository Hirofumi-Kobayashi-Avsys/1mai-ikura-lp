<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>1枚いくら システム構成図</title>
<style>
body { margin: 0; background: #f5f5f0; font-family: "Noto Sans JP", sans-serif; }
svg { display: block; margin: 32px auto; filter: drop-shadow(0 4px 24px rgba(0,0,0,.12)); }
</style>
</head>
<body>
<svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#666"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1f8a5b"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="640" fill="#f5f5f0" rx="0"/>

  <!-- タイトル -->
  <text x="480" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1d2433">1枚いくら　システム構成図</text>
  <text x="480" y="62" text-anchor="middle" font-size="12" fill="#888">2026-11-27</text>

  <!-- ===== ゾーンA: GitHub ===== -->
  <rect x="220" y="88" width="520" height="310" rx="12" fill="#f0f4ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="234" y="110" font-size="12" fill="#2563eb" font-weight="600">GitHub</text>

  <!-- GitHub Actions ボックス -->
  <rect x="300" y="120" width="180" height="80" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="390" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">GitHub Actions</text>
  <text x="390" y="166" text-anchor="middle" font-size="11" fill="#555">毎朝 07:00 JST</text>
  <text x="390" y="182" text-anchor="middle" font-size="11" fill="#555">スケジュール実行</text>

  <!-- GitHub Secrets ボックス -->
  <rect x="510" y="120" width="170" height="80" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="595" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">GitHub Secrets</text>
  <text x="595" y="166" text-anchor="middle" font-size="11" fill="#555">YAHOO_APP_ID</text>
  <text x="595" y="182" text-anchor="middle" font-size="11" fill="#555">LINE_CHANNEL_TOKEN</text>

  <!-- Crawler ボックス -->
  <rect x="300" y="240" width="380" height="130" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="490" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">クローラー (Python)</text>

  <!-- Crawler 内部 -->
  <rect x="318" y="274" width="100" height="40" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="368" y="291" text-anchor="middle" font-size="10" fill="#1e40af">yahoo_client.py</text>
  <text x="368" y="306" text-anchor="middle" font-size="10" fill="#1e40af">価格取得</text>

  <rect x="435" y="274" width="100" height="40" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="485" y="291" text-anchor="middle" font-size="10" fill="#1e40af">parser.py</text>
  <text x="485" y="306" text-anchor="middle" font-size="10" fill="#1e40af">枚数抽出</text>

  <rect x="552" y="274" width="100" height="40" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="602" y="291" text-anchor="middle" font-size="10" fill="#1e40af">notify.py</text>
  <text x="602" y="306" text-anchor="middle" font-size="10" fill="#1e40af">通知判定</text>

  <rect x="318" y="326" width="334" height="28" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="485" y="344" text-anchor="middle" font-size="10" fill="#166534">db.py　SQLite（30日価格履歴 / actions/cache で永続化）</text>

  <!-- ===== ゾーンB: 外部API ===== -->
  <rect x="20" y="88" width="180" height="310" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="34" y="110" font-size="12" fill="#c2410c" font-weight="600">外部 API</text>

  <!-- Yahoo -->
  <rect x="34" y="120" width="152" height="80" rx="10" fill="#fff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="110" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Yahoo!</text>
  <text x="110" y="164" text-anchor="middle" font-size="11" fill="#555">Shopping</text>
  <text x="110" y="180" text-anchor="middle" font-size="11" fill="#555">Item Search API</text>

  <!-- Rakuten (予定) -->
  <rect x="34" y="218" width="152" height="70" rx="10" fill="#fafafa" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="110" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#aaa">楽天市場 API</text>
  <text x="110" y="264" text-anchor="middle" font-size="11" fill="#bbb">（追加予定）</text>

  <!-- ===== ゾーンC: LINE ===== -->
  <rect x="760" y="88" width="180" height="310" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="774" y="110" font-size="12" fill="#16a34a" font-weight="600">LINE</text>

  <!-- LINE Messaging API -->
  <rect x="774" y="120" width="152" height="80" rx="10" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="850" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Messaging API</text>
  <text x="850" y="163" text-anchor="middle" font-size="11" fill="#555">broadcast</text>
  <text x="850" y="179" text-anchor="middle" font-size="11" fill="#555">友だち全員に配信</text>

  <!-- LINE Official Account -->
  <rect x="774" y="218" width="152" height="70" rx="10" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="850" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">LINE公式</text>
  <text x="850" y="260" text-anchor="middle" font-size="11" fill="#555">@667eogtp</text>
  <text x="850" y="276" text-anchor="middle" font-size="11" fill="#555">1枚いくら</text>

  <!-- ===== ゾーンD: ユーザー ===== -->
  <!-- LP -->
  <rect x="20" y="430" width="200" height="80" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="120" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">LP</text>
  <text x="120" y="476" text-anchor="middle" font-size="11" fill="#555">GitHub Pages</text>
  <text x="120" y="492" text-anchor="middle" font-size="11" fill="#555">先行登録ページ</text>

  <!-- ユーザー (LINE) -->
  <rect x="740" y="430" width="200" height="80" rx="10" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="840" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">ユーザー</text>
  <text x="840" y="476" text-anchor="middle" font-size="11" fill="#555">LINEアプリで通知受信</text>
  <text x="840" y="492" text-anchor="middle" font-size="11" fill="#555">友だち数：1</text>

  <!-- ===== 矢印 ===== -->
  <!-- GitHub Actions → Crawler -->
  <line x1="390" y1="200" x2="390" y2="238" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <text x="396" y="224" font-size="10" fill="#2563eb">実行</text>

  <!-- Secrets → Crawler -->
  <line x1="510" y1="160" x2="683" y2="160" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-b)"/>
  <line x1="683" y1="160" x2="683" y2="250" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="683" y1="250" x2="682" y2="250" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-b)"/>
  <text x="696" y="210" font-size="10" fill="#2563eb">環境変数</text>

  <!-- Yahoo API → Crawler -->
  <line x1="186" y1="160" x2="298" y2="295" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="210" y="225" font-size="10" fill="#c2410c">価格データ</text>

  <!-- Crawler → LINE Messaging API -->
  <line x1="682" y1="295" x2="772" y2="160" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="718" y="225" font-size="10" fill="#16a34a">通知送信</text>

  <!-- LINE Messaging API → LINE Official -->
  <line x1="850" y1="200" x2="850" y2="216" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- LINE Official → ユーザー -->
  <line x1="850" y1="288" x2="850" y2="428" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="856" y="365" font-size="10" fill="#16a34a">LINE通知</text>

  <!-- LP → ユーザー -->
  <line x1="220" y1="470" x2="738" y2="470" stroke="#888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="460" y="463" text-anchor="middle" font-size="10" fill="#888">友だち追加して先行登録</text>

  <!-- ===== 凡例 ===== -->
  <rect x="20" y="540" width="920" height="80" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="40" y="562" font-size="11" font-weight="600" fill="#374151">凡例</text>
  <line x1="40" y1="582" x2="80" y2="582" stroke="#2563eb" stroke-width="1.5"/>
  <text x="86" y="586" font-size="11" fill="#555">GitHub内部フロー</text>
  <line x1="200" y1="582" x2="240" y2="582" stroke="#c2410c" stroke-width="1.5"/>
  <text x="246" y="586" font-size="11" fill="#555">外部APIからのデータ取得</text>
  <line x1="420" y1="582" x2="460" y2="582" stroke="#16a34a" stroke-width="1.5"/>
  <text x="466" y="586" font-size="11" fill="#555">LINE通知フロー</text>
  <line x1="600" y1="582" x2="640" y2="582" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="646" y="586" font-size="11" fill="#555">ユーザーアクション（手動）</text>
  <rect x="40" y="598" width="12" height="10" rx="2" fill="#fafafa" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="58" y="608" font-size="11" fill="#bbb">追加予定（楽天API）</text>
</svg>
</body>
</html>
